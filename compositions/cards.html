  </style>
  <div id="root" data-composition-id="cards" data-width="1920" data-height="1080">

  <script>
    (() => {
      const timeline = gsap.timeline({ paused: true });
      document.querySelectorAll("#root .card").forEach((card) => {
        const start = parseFloat(card.dataset.start), dur = parseFloat(card.dataset.duration);
        const end = start + dur - .5;
        const scrim = card.querySelector(".scrim"), head = card.querySelector(".head, .stamp");
        const rule = card.querySelector(".rule"), sub = card.querySelector(".sub");
        const inner = card.querySelector(".card-in");
        if (scrim) timeline.fromTo(scrim, { opacity: 0 }, { opacity: 1, duration: .7, ease: "sine.out" }, start - .1);
        // Headline: tracking closes in while it rises and fades up.
        timeline.fromTo(head, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 1.1, ease: "power3.out" }, start);
        if (!head.classList.contains("stamp")) timeline.fromTo(head, { scale: 1.06 }, { scale: 1, duration: 1.6, ease: "power2.out" }, start);
        if (head.classList.contains("stamp")) timeline.fromTo(head, { scale: 1.35, rotation: 0 }, { scale: 1, rotation: -3, duration: .35, ease: "back.out(2)" }, start);
        timeline.fromTo(rule, { width: 0 }, { width: card.querySelector(".bc, .center") ? 520 : 360, duration: .9, ease: "power2.inOut" }, start + .3);
        if (sub) timeline.fromTo(sub, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: .8, ease: "power2.out" }, start + .45);
        // Slow drift for the whole hold so the type is never static.
        timeline.fromTo(inner, { x: 0 }, { x: 10, duration: dur, ease: "none" }, start);
        // Exit: everything lifts and fades together.
        timeline.to([head, sub, rule].filter(Boolean), { opacity: 0, y: -10, duration: .45, ease: "sine.in", stagger: .04 }, end);
        if (scrim) timeline.to(scrim, { opacity: 0, duration: .5, ease: "sine.in" }, end + .05);
      });
      window.__timelines = window.__timelines || {};
      window.__timelines.cards = timeline;
    })();
  </script>
