        streak.style.height = `${length}px`;
        rain.appendChild(streak);
        timeline.to(streak, {
          keyframes: {
            "0%": { x: 0, y: 0, opacity: 0 },
            "17%": { x: -.068 * travel, y: .17 * travel, opacity },
            "78%": { x: -.312 * travel, y: .78 * travel, opacity: opacity * .85 },

            easeEach: "none"

          duration: (end - start) / passes, repeat: passes - 1, ease: "none"
