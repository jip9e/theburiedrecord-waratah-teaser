name: Render teaser
# Push = quick 480p preview. Final 4K only via "Run workflow" with quality=final.
# Every scene renders on its own runner at the same time; a last job stitches them and adds the mix.
on:
  workflow_dispatch:
    inputs:
      quality:
        description: preview (480p draft) or final (4K delivery)
        type: choice
        options: [preview, final]
        default: preview
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true
env:
  QUALITY: ${{ inputs.quality || 'preview' }}
  HF: hyperframes@0.8.214
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      scenes: ${{ steps.list.outputs.scenes }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "scenes=$(node tools/make-chunk.mjs --list)" >> "$GITHUB_OUTPUT"

  scene:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      max-parallel: 20
      matrix:
        scene: ${{ fromJson(needs.plan.outputs.scenes) }}
    name: scene ${{ matrix.scene.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static ffmpeg
        run: |
          curl -sfL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
      - name: Keep only this scene
        run: node tools/make-chunk.mjs "${{ matrix.scene.id }}"
      - name: Render scene
        run: |
          mkdir -p out
          if [ "$QUALITY" = final ]; then Q="-q delivery --resolution 4k"; else Q="-q draft"; fi
          npx --yes $HF render -o "out/${{ matrix.scene.id }}.mp4" $Q -w 4 --quiet 2>&1 | tail -15
          ffprobe -v error -show_entries stream=nb_frames,width,height -of compact "out/${{ matrix.scene.id }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.scene.id }}
          path: out/${{ matrix.scene.id }}.mp4
          compression-level: 0
          retention-days: 3

  stitch:
    needs: [plan, scene]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static ffmpeg
        run: |
          curl -sfL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
          merge-multiple: true
      - name: Stitch scenes (frame-exact), add mix, loudness pass
        env:
          SCENES: ${{ needs.plan.outputs.scenes }}
        run: |
          mkdir -p out
          if [ "$QUALITY" = final ]; then export SCALE="scale=3840:2160"; ENC="-c:v libx264 -preset slow -crf 14 -pix_fmt yuv420p"; NAME=waratah_teaser_4k.mp4
          else export SCALE="scale=-2:480"; ENC="-c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p"; NAME=waratah_teaser_preview480.mp4; fi
          # Each scene starts on exactly round(start*30) and renders a tail past its cut; the next scene
          # crossfades in over that tail (xfade offset = its global start), so the mix stays in sync.
          node -e '
            const s = JSON.parse(process.env.SCENES); let inputs = [], f = "";
            const X = { steamship: ["fade", 1.0], title: ["zoomin", 1.0], chart: ["fadeblack", 1.2], night: ["zoomin", 0.9],
              silence: ["fadeblack", 0.7], storm: ["fadewhite", 0.25], newspaper: ["zoomin", 0.6], "storm-detail": ["smoothleft", 0.8], closing: ["fadeblack", 1.2] };
            s.forEach((c, i) => {
              const n = Math.round((c.start + c.dur) * 30) - Math.round(c.start * 30) + Math.round((c.tail || 0) * 30);
              inputs.push("-i", `chunks/${c.id}.mp4`);
              f += `[${i}:v]fps=30,${process.env.SCALE},setsar=1,format=yuv420p,tpad=stop_mode=clone:stop=60,trim=end_frame=${n},setpts=PTS-STARTPTS[v${i}];`;
            });
            let acc = "v0";
            s.slice(1).forEach((c, k) => {
              const i = k + 1, [t, d0] = X[c.id] || ["fade", 0.8], d = Math.min(d0, s[i - 1].tail || 0.04);
              const off = (Math.round(c.start * 30) / 30).toFixed(4), out = i === s.length - 1 ? "v" : `x${i}`;
              f += `[${acc}][v${i}]xfade=transition=${t}:duration=${d}:offset=${off}[${out}];`;
              acc = out;
            });
            f += `[${s.length}:a]loudnorm=I=-14:TP=-1:LRA=11,aresample=48000[a]`;
            require("fs").writeFileSync("inputs.txt", inputs.join(" "));
            require("fs").writeFileSync("graph.txt", f);'
          ffmpeg -nostdin -v error -y $(cat inputs.txt) -i assets/sfx/mix_v2.wav \
            -/filter_complex graph.txt -map "[v]" -map "[a]" \
            $ENC -r 30 -fps_mode cfr -c:a aac -b:a 256k -t 63 -movflags +faststart "out/$NAME"
          ffmpeg -hide_banner -i "out/$NAME" -af ebur128=peak=true -f null - 2>&1 | grep -E "I:|Peak:" | tail -2
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height,nb_frames -of compact "out/$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: waratah-teaser-${{ env.QUALITY }}
          path: out/*.mp4
          compression-level: 0
          retention-days: 30
